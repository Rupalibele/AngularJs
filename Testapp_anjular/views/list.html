<div class="container">
    <h2>Product List</h2>
    <div ng-repeat="product in vm.products">
        <h3>{{ product.name }}</h3>
        <img ng-src="{{ product.image }}" alt="{{ product.name }}" width="100">
        <p>{{ product.description }}</p>
        <p>Price: ${{ product.price }}</p>
    </div>
</div>
