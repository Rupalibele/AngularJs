<div>
    <h2>Product List</h2>
    <ul>
        <li ng-repeat="product in productCtrl.products">
            <h3>{{ product.name }}</h3>
            <p>Price: {{ product.price }}</p>
            <img ng-src="{{ product.image }}" alt="{{ product.name }}" width="100">
            <p>{{ product.description }}</p>
        </li>
    </ul>
</div>
